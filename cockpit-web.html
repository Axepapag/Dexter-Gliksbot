<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexter Cockpit - Web Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .panel h2 {
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .status-dot.disconnected {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: rgba(100, 149, 237, 0.3);
            border-left: 4px solid #6495ed;
        }

        .message.dexter {
            background: rgba(255, 215, 0, 0.2);
            border-left: 4px solid #ffd700;
        }

        .message.bsm {
            background: rgba(138, 43, 226, 0.2);
            border-left: 4px solid #8a2be2;
        }

        .message .label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .message .content {
            line-height: 1.6;
        }

        .message .meta {
            font-size: 0.8em;
            opacity: 0.6;
            margin-top: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .events-log {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .event {
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            border-left: 3px solid;
        }

        .event.info { border-left-color: #3498db; }
        .event.warn { border-left-color: #f39c12; }
        .event.error { border-left-color: #e74c3c; }

        .event-time {
            opacity: 0.6;
            font-size: 0.85em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00ff88;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 5px;
        }

        .full-width {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Dexter Cockpit - Web Interface</h1>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="backendStatus"></div>
                <span id="backendText">Backend: Checking...</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="wsStatus"></div>
                <span id="wsText">WebSocket: Disconnected</span>
            </div>
            <div class="status-item">
                <span id="providerInfo">Provider: Loading...</span>
            </div>
        </div>

        <div class="dashboard">
            <!-- Dexter Chat -->
            <div class="panel">
                <h2>💬 Chat with Dexter</h2>
                <div class="chat-box" id="dexterChat"></div>
                <div class="input-group">
                    <input type="text" id="dexterInput" placeholder="Message Dexter..." onkeypress="if(event.key==='Enter') sendToDexter()">
                    <button onclick="sendToDexter()">Send</button>
                </div>
            </div>

            <!-- BSM Chat -->
            <div class="panel">
                <h2>🧠 Chat with BSM</h2>
                <div class="chat-box" id="bsmChat"></div>
                <div class="input-group">
                    <input type="text" id="bsmInput" placeholder="Message BSM..." onkeypress="if(event.key==='Enter') sendToBSM()">
                    <button onclick="sendToBSM()">Send</button>
                </div>
            </div>

            <!-- System Stats -->
            <div class="panel">
                <h2>📊 System Stats</h2>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="statObservations">0</div>
                        <div class="stat-label">Observations</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statMessages">0</div>
                        <div class="stat-label">Messages</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statAgents">2</div>
                        <div class="stat-label">Active Agents</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statUptime">0s</div>
                        <div class="stat-label">Uptime</div>
                    </div>
                </div>
            </div>

            <!-- Real-time Events -->
            <div class="panel">
                <h2>📡 Real-time Events</h2>
                <div class="events-log" id="eventsLog"></div>
                <button onclick="connectWebSocket()">Connect WebSocket</button>
                <button onclick="disconnectWebSocket()">Disconnect</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let messageCount = 0;
        let startTime = Date.now();

        // Check backend health
        async function checkBackend() {
            try {
                const response = await fetch('http://localhost:8765/health');
                const data = await response.json();
                
                document.getElementById('backendStatus').className = 'status-dot connected';
                document.getElementById('backendText').textContent = `Backend: ${data.status.toUpperCase()}`;
                
                // Update stats
                if (data.components.bsm) {
                    document.getElementById('statObservations').textContent = data.components.bsm.observations;
                }
                
                // Get provider info
                const statsResponse = await fetch('http://localhost:8765/stats');
                const stats = await statsResponse.json();
                document.getElementById('providerInfo').textContent = 'Provider: Ready';
                
                return true;
            } catch (error) {
                document.getElementById('backendStatus').className = 'status-dot disconnected';
                document.getElementById('backendText').textContent = 'Backend: ERROR';
                return false;
            }
        }

        // Connect WebSocket
        function connectWebSocket() {
            addEvent('info', 'Connecting to WebSocket...');
            
            ws = new WebSocket('ws://localhost:8765/ws/cockpit');
            
            ws.onopen = () => {
                document.getElementById('wsStatus').className = 'status-dot connected';
                document.getElementById('wsText').textContent = 'WebSocket: Connected';
                addEvent('info', '✓ WebSocket connected');
                
                // Subscribe to all events
                ws.send(JSON.stringify({
                    type: 'subscribe',
                    agents: ['*'],
                    missions: ['*'],
                    log_level: 'INFO'
                }));
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addEvent('info', `Event: ${data.type || 'unknown'}`);
                    messageCount++;
                    document.getElementById('statMessages').textContent = messageCount;
                } catch (error) {
                    addEvent('error', `Parse error: ${error.message}`);
                }
            };
            
            ws.onerror = (error) => {
                addEvent('error', 'WebSocket error occurred');
            };
            
            ws.onclose = () => {
                document.getElementById('wsStatus').className = 'status-dot disconnected';
                document.getElementById('wsText').textContent = 'WebSocket: Disconnected';
                addEvent('warn', 'WebSocket disconnected');
            };
        }

        // Disconnect WebSocket
        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        // Send to Dexter
        async function sendToDexter() {
            const input = document.getElementById('dexterInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage('dexterChat', 'user', 'You', message);
            input.value = '';
            
            try {
                const response = await fetch('http://localhost:8765/dexter/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                
                const data = await response.json();
                addMessage('dexterChat', 'dexter', 'Dexter', data.response, data.metadata);
            } catch (error) {
                addMessage('dexterChat', 'error', 'Error', error.message);
            }
        }

        // Send to BSM
        async function sendToBSM() {
            const input = document.getElementById('bsmInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage('bsmChat', 'user', 'You', message);
            input.value = '';
            
            try {
                const response = await fetch('http://localhost:8765/bsm/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                
                const data = await response.json();
                addMessage('bsmChat', 'bsm', 'BSM', data.response, data.metadata);
                
                // Update observations count
                if (data.metadata.observations !== undefined) {
                    document.getElementById('statObservations').textContent = data.metadata.observations;
                }
            } catch (error) {
                addMessage('bsmChat', 'error', 'Error', error.message);
            }
        }

        // Add message to chat
        function addMessage(chatId, type, label, content, metadata) {
            const chatBox = document.getElementById(chatId);
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            let metaText = '';
            if (metadata) {
                metaText = `<div class="meta">Provider: ${metadata.provider || 'unknown'} | Model: ${metadata.model || 'unknown'}`;
                if (metadata.usage) {
                    metaText += ` | Tokens: ${metadata.usage.total_tokens || '?'}`;
                }
                metaText += '</div>';
            }
            
            messageDiv.innerHTML = `
                <div class="label">${label}</div>
                <div class="content">${content}</div>
                ${metaText}
            `;
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Add event to log
        function addEvent(level, message) {
            const log = document.getElementById('eventsLog');
            const eventDiv = document.createElement('div');
            eventDiv.className = `event ${level}`;
            
            const time = new Date().toLocaleTimeString();
            eventDiv.innerHTML = `
                <span class="event-time">[${time}]</span> ${message}
            `;
            
            log.appendChild(eventDiv);
            log.scrollTop = log.scrollHeight;
            
            // Keep only last 50 events
            while (log.children.length > 50) {
                log.removeChild(log.firstChild);
            }
        }

        // Update uptime
        function updateUptime() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            
            let uptime = '';
            if (hours > 0) uptime += `${hours}h `;
            if (minutes > 0) uptime += `${minutes}m `;
            uptime += `${seconds}s`;
            
            document.getElementById('statUptime').textContent = uptime;
        }

        // Initialize
        async function init() {
            addEvent('info', 'Initializing Dexter Cockpit...');
            
            const backendOk = await checkBackend();
            if (backendOk) {
                addEvent('info', '✓ Backend is healthy');
            } else {
                addEvent('error', '✗ Backend is not responding');
            }
            
            // Update uptime every second
            setInterval(updateUptime, 1000);
            
            // Check backend health every 10 seconds
            setInterval(checkBackend, 10000);
        }

        // Start
        init();
    </script>
</body>
</html>
