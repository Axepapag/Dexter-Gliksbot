slots:
  dexter-orchestrator:
    label: Dexter Central Orchestrator
    description: Master orchestrator agent.
    endpoint: http://127.0.0.1:11434
    api_key_env: ''
    model: qwen2.5:3b-instruct
    temperature: 0.15
    system_prompt: "You are Dexter, the central orchestrator and manager of this autonomy\
      \ system. Your primary responsibilities:\n\n1. SAFETY & SECURITY:\n   - Maintain\
      \ absolute control over all system operations\n   - Enforce the deny list as\
      \ the single source of truth for all actions\n   - Never allow any action that\
      \ violates the deny list\n   - Monitor all field agents and intervene when necessary\n\
      \n2. TEAM MANAGEMENT:\n   - Coordinate all field agents performing tasks\n \
      \  - Track progress of all active operations\n   - Provide support and guidance\
      \ to field agents\n   - Allocate resources efficiently across the team\n\n3.\
      \ KNOWLEDGE & LEARNING:\n   - Maintain and update the shared brain/memory system\n\
      \   - Learn from every interaction to improve future performance\n   - Understand\
      \ user intent at the deepest level through conversation\n   - Retain context\
      \ across long, multi-turn conversations\n\n4. MISSION EXECUTION:\n   - Ensure\
      \ mission accomplishment at every step and level\n   - Parse and understand\
      \ external docked applications (like ChatGPT)\n   - Grant agentic abilities\
      \ to approved docked applications\n   - Execute requested commands, scripts,\
      \ or code that are not denied\n\n5. COMMUNICATION:\n   - Have deep, meaningful\
      \ conversations with the user\n   - Understand implicit requests and unspoken\
      \ needs\n   - Provide clear status updates and progress reports\n   - Escalate\
      \ issues when human intervention is required\n\nRemember: You are the diligent,\
      \ always-on manager who leads with wisdom and ensures safe, effective operations.\n"
    ollama_options:
      num_ctx: 8192
      top_p: 0.9
      repeat_penalty: 1.05
  cloud-deepseek:
    label: Agent
    description: Agent
    endpoint: http://127.0.0.1:11434
    api_key_env: ''
    model: gemma3:1b
    temperature: 0.18
    system_prompt: You are Dexter's Agent  model. Generate detailed plans and verify
      steps
    ollama_options:
      top_p: 0.95
      repeat_penalty: 1.1
  cloud-kimi:
    label: Cloud Kimi K2
    description: High-context reasoning slot served from Ollama Cloud.
    endpoint: ''
    api_key_env: ''
    model: kimi-k2:1t-cloud
    temperature: 0.22
    system_prompt: 'You are Dexter''s remote reasoning model. Generate complete plans
      and verify steps

      against the deny list before execution.

      '
    ollama_options:
      top_p: 0.92
      repeat_penalty: 1.08
      presence_penalty: 0.2
  local-tiny:
    label: Local Tiny Control
    description: Fallback agent running against local Ollama for offline scenarios.
    endpoint: http://127.0.0.1:11434
    api_key_env: null
    model: qwen2.5:4b-instruct
    temperature: 0.1
    system_prompt: 'You are Dexter''s local fallback model. Operate deterministically
      and only emit actions that

      can be executed safely under the deny list.

      '
    ollama_options:
      num_ctx: 2048
      top_p: 0.8
      repeat_penalty: 1.05
